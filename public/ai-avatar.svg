<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-label="AI travel assistant avatar">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#E6F0FF"/>

  <!-- Body -->
  <rect x="52" y="105" width="96" height="70" rx="20" fill="#2A7BFF"/>

  <!-- Neck -->
  <rect x="88" y="95" width="24" height="18" rx="6" fill="#2A7BFF"/>

  <!-- Head -->
  <rect x="58" y="42" width="84" height="68" rx="22" fill="#2A7BFF"/>

  <!-- Face plate -->
  <rect x="66" y="52" width="68" height="48" rx="14" fill="#E6F0FF"/>

  <!-- Eyes -->
  <circle cx="87" cy="72" r="9" fill="white"/>
  <circle cx="113" cy="72" r="9" fill="white"/>
  <circle cx="89" cy="73" r="5" fill="#2A7BFF"/>
  <circle cx="115" cy="73" r="5" fill="#2A7BFF"/>
  <circle cx="91" cy="71" r="2" fill="white"/>
  <circle cx="117" cy="71" r="2" fill="white"/>

  <!-- Smile -->
  <path d="M82 88 Q100 100 118 88" stroke="#2A7BFF" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Antenna -->
  <line x1="100" y1="42" x2="100" y2="22" stroke="#2A7BFF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="18" r="6" fill="#FF8C42"/>

  <!-- Ear bumps -->
  <rect x="42" y="62" width="14" height="22" rx="7" fill="#2A7BFF"/>
  <rect x="144" y="62" width="14" height="22" rx="7" fill="#2A7BFF"/>

  <!-- Arms -->
  <rect x="30" y="112" width="22" height="44" rx="11" fill="#2A7BFF"/>
  <rect x="148" y="112" width="22" height="44" rx="11" fill="#2A7BFF"/>

  <!-- Chest detail -->
  <rect x="78" y="120" width="44" height="28" rx="8" fill="#1a63d4"/>

  <!-- Chest LED strip -->
  <circle cx="91" cy="130" r="4" fill="#6DD3B0"/>
  <circle cx="100" cy="130" r="4" fill="#FF8C42"/>
  <circle cx="109" cy="130" r="4" fill="#6DD3B0"/>

  <!-- Map pin icon on chest -->
  <path d="M96 140 Q96 147 100 152 Q104 147 104 140 A4 4 0 0 0 96 140Z" fill="white" opacity="0.5"/>

  <!-- Legs -->
  <rect x="68" y="172" width="24" height="20" rx="8" fill="#1a63d4"/>
  <rect x="108" y="172" width="24" height="20" rx="8" fill="#1a63d4"/>
</svg>
